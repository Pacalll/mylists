server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Angular → Nginx
    location / {
         try_files $uri $uri/ /index.html;
    }

    # API → Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static Files
    location /static/ {
        alias /app/static/;
    }

}
